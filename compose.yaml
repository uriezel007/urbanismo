services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: phei
      POSTGRES_USER: phei_owner
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      PHEI_DB_PASSWORD: ${PHEI_DB_PASSWORD:?Set PHEI_DB_PASSWORD}
    volumes:
      - phei_db:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-phei.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phei_owner -d phei']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with phei_app credentials}
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      PHEI_ENV: production
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
volumes:
  phei_db:
