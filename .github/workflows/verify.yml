name: PHEI verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: phei_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: phei_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U phei_test -d phei_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/build-offline.mjs
      - run: npm test
      - run: python -m pip install -r api/requirements.txt httpx==0.28.1 playwright==1.55.0
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
        env:
          PHEI_TEST_POSTGRES_URL: postgresql://phei_test:ephemeral-ci-only@localhost:5432/phei_test
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phei-delivery-and-qa
          path: |
            dist/
            artifacts/
  webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: node -e "console.log('PHEI_LOCK_BEGIN'+JSON.stringify(require('./package-lock.json'))+'PHEI_LOCK_END')"
      - run: npm run build:webgl
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.webgl_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: phei-webgl-preview
          path: |
            dist-webgl/
            package-lock.json
            artifacts/phei-react-webgl.png

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m tests.deployment_smoke
