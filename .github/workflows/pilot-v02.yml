name: PHEI pilot v0.2 checks
on:
  push:
    branches:
      - 'codex/phei-commercial-pilot-20261019'
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-v02.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test pilot/metrics.test.cjs
