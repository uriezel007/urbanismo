name: Growth v0.2 checks
on:
  push:
    branches:
      - 'codex/preser-growth-lab-20261019'
  pull_request:
    paths:
      - 'growth/**'
      - '.github/workflows/growth-v02.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test growth/core.test.cjs
